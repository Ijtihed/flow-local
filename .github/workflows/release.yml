name: Publish update
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: publish-flow-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  build-windows:
    needs: checks
    runs-on: windows-latest
    environment: windows-signing
    permissions:
      contents: read
      id-token: write
    env:
      FLOW_SIGNING_PROVIDER: ${{ vars.FLOW_SIGNING_PROVIDER }}
      FLOW_SIGNING_ENDPOINT: ${{ vars.FLOW_SIGNING_ENDPOINT }}
      FLOW_SIGNING_ACCOUNT: ${{ vars.FLOW_SIGNING_ACCOUNT }}
      FLOW_SIGNING_PROFILE: ${{ vars.FLOW_SIGNING_PROFILE }}
      FLOW_SIGNER_SUBJECT: ${{ vars.FLOW_SIGNER_SUBJECT }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Validate release version
        shell: bash
        run: python tools/release_version.py --check
      - name: Validate optional Windows signing configuration
        if: vars.FLOW_SIGNING_PROVIDER != ''
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          Import-Module ./tools/signing.psm1
          Assert-FlowSigningConfiguration
          if ($env:FLOW_SIGNING_PROVIDER -ne 'azure') { throw 'Hosted releases require Azure Artifact Signing. See docs/WINDOWS_SIGNING.md for other signing providers.' }
          foreach ($name in 'AZURE_CLIENT_ID','AZURE_TENANT_ID','AZURE_SUBSCRIPTION_ID') {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "Missing $name. Complete docs/WINDOWS_SIGNING.md before publishing." }
          }
      - name: Authenticate signing account
        if: vars.FLOW_SIGNING_PROVIDER != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Install official signing module
        if: vars.FLOW_SIGNING_PROVIDER != ''
        shell: pwsh
        run: Install-Module ArtifactSigning -RequiredVersion 0.1.20 -Scope CurrentUser -Repository PSGallery -Force
      - name: Build Windows packages and check the runtime
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python -m pip install --upgrade pip setuptools
          .\.venv\Scripts\pip install -r requirements.txt pyinstaller
          if ($env:FLOW_SIGNING_PROVIDER) { .\build.ps1 -Signed } else { .\build.ps1 }
          $flowTest = Start-Process -FilePath dist\Flow\Flow.exe -ArgumentList '--self-test-headless','--test-report','windows-runtime.json' -WindowStyle Hidden -Wait -PassThru
          if ($flowTest.ExitCode -ne 0) { throw 'Packaged runtime failed' }
          $windowTest = Start-Process -FilePath dist\Flow\Flow.exe -ArgumentList '--self-test-window','--test-report','windows-window.json' -WindowStyle Hidden -Wait -PassThru
          if ($windowTest.ExitCode -ne 0) { throw 'Packaged native window or tutorial failed' }
          .\.venv\Scripts\python tools/check_mcp.py --command "$PWD/dist/Flow/FlowMCP.exe" --args '[]' --report windows-mcp.json
          if ($LASTEXITCODE -ne 0) { throw 'Packaged MCP protocol check failed' }
      - name: Check installed app, upgrade and uninstall
        shell: pwsh
        run: ./tools/check-install.ps1 -Report windows-install.json
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: flow-Windows
          path: |
            installer/FlowSetup.exe
            *-runtime.json
            windows-window.json
            windows-mcp.json
            windows-install.json
            windows-signatures.json
          if-no-files-found: error
          retention-days: 7
  build-linux:
    needs: checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - run: python tools/release_version.py --check
      - run: sudo apt-get update && sudo apt-get install -y python3-venv python3-tk libportaudio2 xclip xdotool
      - name: Build Linux package and check the runtime
        run: |
          bash build-linux.sh
          installer/Flow-x86_64.AppImage --appimage-extract-and-run --self-test-headless --test-report linux-runtime.json
          .venv-linux/bin/python tools/check_mcp.py --command "$PWD/installer/Flow-x86_64.AppImage" --args '["--appimage-extract-and-run", "--mcp"]' --report linux-mcp.json
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: flow-Linux
          path: |
            installer/Flow-x86_64.AppImage
            installer/Flow-x86_64.AppImage.sha256
            linux-runtime.json
            linux-mcp.json
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          path: release-files
          merge-multiple: true
      - name: Prepare release files
        shell: bash
        run: |
          python tools/release_version.py --check
          python - <<'PY'
          from pathlib import Path
          import shutil
          folder = Path('release-files')
          for name in ('FlowSetup.exe', 'Flow-x86_64.AppImage'):
              source = next(folder.rglob(name))
              target = folder/name
              if source != target: shutil.copy2(source, target)
          PY
          (cd release-files && sha256sum FlowSetup.exe Flow-x86_64.AppImage > SHA256SUMS.txt)
          (cd site && zip -r ../release-files/Flow-website.zip .)
      - name: Publish verified update
        shell: bash
        run: |
          FLOW_TAG="v$(python -c 'from version import APP_VERSION; print(APP_VERSION)')"
          if gh release view "$FLOW_TAG" >/dev/null 2>&1; then
            echo 'This version already has a release. Bump the version before publishing.' >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$FLOW_TAG" >/dev/null 2>&1; then
            FLOW_TAG_COMMIT="$(gh api "repos/$GITHUB_REPOSITORY/commits/$FLOW_TAG" --jq .sha)"
            if [ "$FLOW_TAG_COMMIT" != "$GITHUB_SHA" ]; then
              echo 'The version tag points to different source. Choose an unused version.' >&2
              exit 1
            fi
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$FLOW_TAG" -f "sha=$GITHUB_SHA" >/dev/null
          fi
          python - <<'PY'
          from pathlib import Path
          Path('release-notes.md').write_text('Download FlowSetup.exe for Windows or Flow-x86_64.AppImage for Linux. Choose your speech engine and model during setup.\n\nWindows downloads are unsigned unless this release includes a verified windows-signatures.json report; SmartScreen may show an unrecognized-app warning. SHA256SUMS.txt verifies file integrity.\n\nWebsite: https://ijtihed.github.io/flow-local/\nMCP setup: https://github.com/Ijtihed/flow-local/blob/main/docs/MCP.md\n', encoding='utf-8')
          PY
          gh release create "$FLOW_TAG" release-files/FlowSetup.exe release-files/Flow-x86_64.AppImage release-files/SHA256SUMS.txt release-files/Flow-website.zip --verify-tag --title "Flow ${FLOW_TAG#v}" --notes-file release-notes.md --draft
          if [ -f release-files/windows-signatures.json ]; then gh release upload "$FLOW_TAG" release-files/windows-signatures.json; fi
          gh release edit "$FLOW_TAG" --draft=false --latest
