name: Publish update
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: publish-flow-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  build:
    needs: checks
    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Validate release version
        shell: bash
        run: python tools/release_version.py --check
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-venv python3-tk libportaudio2 xclip xdotool
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\pip install -r requirements.txt pyinstaller
          .\build.ps1
          $flowTest = Start-Process -FilePath dist\Flow\Flow.exe -ArgumentList '--self-test-headless','--test-report','windows-runtime.json' -WindowStyle Hidden -Wait -PassThru
          if ($flowTest.ExitCode -ne 0) { throw 'Packaged runtime failed' }
          $windowTest = Start-Process -FilePath dist\Flow\Flow.exe -ArgumentList '--self-test-window','--test-report','windows-window.json' -WindowStyle Hidden -Wait -PassThru
          if ($windowTest.ExitCode -ne 0) { throw 'Packaged native window or tutorial failed' }
      - if: runner.os == 'Linux'
        shell: bash
        run: |
          bash build-linux.sh
          installer/Flow-x86_64.AppImage --appimage-extract-and-run --self-test-headless --test-report linux-runtime.json
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: flow-${{ runner.os }}
          path: |
            installer/FlowSetup.exe
            installer/Flow-x86_64.AppImage
            installer/Flow-x86_64.AppImage.sha256
            *-runtime.json
            windows-window.json
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          path: release-files
          merge-multiple: true
      - name: Prepare release files
        shell: bash
        run: |
          python tools/release_version.py --check
          python - <<'PY'
          from pathlib import Path
          import shutil
          folder = Path('release-files')
          for name in ('FlowSetup.exe', 'Flow-x86_64.AppImage'):
              source = next(folder.rglob(name))
              target = folder/name
              if source != target: shutil.copy2(source, target)
          PY
          (cd release-files && sha256sum FlowSetup.exe Flow-x86_64.AppImage > SHA256SUMS.txt)
          (cd site && zip -r ../release-files/Flow-website.zip .)
      - name: Publish verified update
        shell: bash
        run: |
          FLOW_TAG="v$(python -c 'from version import APP_VERSION; print(APP_VERSION)')"
          if gh release view "$FLOW_TAG" >/dev/null 2>&1; then
            echo 'This version already has a release. Bump the version before publishing.' >&2
            exit 1
          fi
          gh release create "$FLOW_TAG" release-files/FlowSetup.exe release-files/Flow-x86_64.AppImage release-files/SHA256SUMS.txt release-files/Flow-website.zip --target "$GITHUB_SHA" --title "Flow ${FLOW_TAG#v}" --generate-notes --draft
          gh release edit "$FLOW_TAG" --draft=false --latest
