<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow: talk, it types</title>
<meta name="description" content="Speak naturally. Flow does the typing. Voice dictation for Windows and Linux.">
<link rel="icon" href="favicon.ico">
<style>
  @font-face { font-family: "Plex Sans"; src: url("assets/PlexSans-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Plex Sans"; src: url("assets/PlexSans-500.woff2") format("woff2"); font-weight: 500; font-display: swap; }
  @font-face { font-family: "Plex Sans"; src: url("assets/PlexSans-600.woff2") format("woff2"); font-weight: 600; font-display: swap; }

:root { --ink: #141414; --ink-2: #6B6B68; --ink-3: #A5A5A1; --line: #EAEAE7; --side: #F7F7F5; --fill: #F3F3F1; --serif: "Plex Sans", Georgia, serif; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: #fff; color: var(--ink); font: 16px/1.55 "Plex Sans", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; letter-spacing: -.005em;
    display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
  a { color: inherit; }
  .wrap { width: 100%; max-width: 1440px; margin: 0 auto; padding: 0 clamp(24px, 3.5vw, 48px); }

  nav { display: flex; align-items: center; justify-content: space-between; height: 76px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .brand img { width: 28px; height: 28px; }
  .brand b { font-family: "Plex Sans", sans-serif; font-weight: 600; font-size: 25px; line-height: 1; }
  nav .gh { font-size: 14px; color: var(--ink-2); text-decoration: none; }
  nav .gh:hover { color: var(--ink); }

  main { display: grid; grid-template-columns: minmax(0, .85fr) minmax(0, 1.3fr); gap: clamp(32px, 5vw, 72px); align-items: center; min-height: 0; padding-bottom: 40px; }
  h1 { font-family: "Plex Sans", sans-serif; font-weight: 500; font-size: clamp(48px, min(6vw, 10vh), 86px); line-height: 1.02; letter-spacing: -.045em; margin: 0; }
  h1 em { color: var(--ink-2); font-style: normal; }
  .lede { font-size: clamp(15px, 1.35vw, 18px); color: var(--ink-2); max-width: 460px; margin: clamp(16px, 3vh, 26px) 0 clamp(20px, 4vh, 32px); }
  .cta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: 10px; height: 50px; padding: 0 24px; border-radius: 25px; background: var(--ink); color: #fff; text-decoration: none; font-weight: 550; font-size: 15px; transition: opacity .15s; }
  .btn:hover { opacity: .86; }
  .btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .btn.secondary { background: #fff; color: var(--ink-2); border: 1px solid #DEDEDA;  }
  .btn.secondary:hover { background: var(--side); }
  .btn.soon i { font-style: normal; font-size: 12px; color: var(--ink-3); }
  .fine { font-size: 13px; color: var(--ink-3); margin-top: 14px; }

  .steps { display: grid; grid-template-columns: repeat(3, auto); justify-content: start; margin-top: clamp(24px, 5vh, 46px); border-top: 1px solid var(--line); }
  .steps div { padding: 16px 30px 0 0; transition: opacity .3s; opacity: .38; }
  .steps div.on { opacity: 1; }
  .steps div + div { padding-left: 30px; border-left: 1px solid var(--line); }
  .steps b { display: block; font-weight: 600; font-size: 15px; letter-spacing: -.01em; margin-bottom: 4px; }
  .steps span { font-size: 13px; color: var(--ink-2); }
  kbd { font: 500 11.5px/1 "Plex Sans", sans-serif; color: var(--ink); background: #fff; border: 1px solid #DDDDD9; border-bottom-width: 2px; border-radius: 5px; padding: 2px 6px; transition: transform .15s, border-bottom-width .15s; }
  .held kbd { transform: translateY(1px); border-bottom-width: 1px; background: var(--fill); }

  /* the live demo */
  .stage { position: relative; }
  .tag { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); margin: 0 0 12px 2px; height: 20px; }
  .tag b { font-weight: 600; color: var(--ink); }
  .tag i { font-style: normal; color: var(--ink-3); }
  .win { position: relative; height: clamp(320px, 57vh, 520px); border: 1px solid var(--line); border-radius: 16px; background: #fff; box-shadow: 0 30px 60px -30px rgba(0,0,0,.18); overflow: hidden; display: flex; flex-direction: column; }
  .bar { height: 44px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--side); font-size: 13px; font-weight: 550; }
  .bar .dot { width: 22px; height: 22px; border-radius: 6px; background: var(--ink); color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 600; }
  .bar small { font-weight: 400; color: var(--ink-3); margin-left: auto; }
  .body { flex: 1; min-height: 0; padding: 20px 22px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
  .msg { max-width: 85%; padding: 12px 16px; border-radius: 14px; font-size: 16px; line-height: 1.45; background: var(--fill); align-self: flex-start; }
  .msg.me { background: var(--ink); color: #fff; align-self: flex-end; animation: pop .35s cubic-bezier(.2,.8,.2,1); }
  @keyframes pop { from { transform: translateY(6px) scale(.97); opacity: 0; } }
  .input { margin-top: auto; min-height: 52px; border: 1px solid var(--line); border-radius: 12px; padding: 13px 16px; font-size: 16px; line-height: 1.45; }
  .field { display: flex; gap: 10px; font-size: 13.5px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .field span { color: var(--ink-3); width: 56px; }
  .mail { flex: 1; padding-top: 14px; font-size: 16px; line-height: 1.6; white-space: pre-wrap; }
  .typed { white-space: pre-wrap; }
  .caret { display: inline-block; width: 1.5px; height: 1.1em; background: var(--ink); vertical-align: -3px; margin-left: 1px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .word { animation: word .28s ease both; }
  @keyframes word { from { opacity: 0; filter: blur(3px); } }

  .pill { position: absolute; left: 50%; bottom: 18px; transform: translate(-50%, 16px) scale(.9); opacity: 0; height: 40px; padding: 0 18px; border-radius: 20px; background: #fff; border: 1px solid rgba(0,0,0,.08);
    box-shadow: 0 10px 30px rgba(0,0,0,.14); display: flex; align-items: center; gap: 4px; transition: all .35s cubic-bezier(.2,.8,.2,1); pointer-events: none; }
  .pill-label { font-size: 12px; font-weight: 500; margin: 0 12px 0 2px; }
  .pill.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
  .pill i { width: 3px; height: 6px; border-radius: 3px; background: var(--ink); }
  .pill.listen i { animation: talk .5s ease-in-out infinite alternate; }
  .pill.think i { animation: think 1s ease-in-out infinite; opacity: .5; }
  @keyframes talk { from { height: 4px; } to { height: var(--h, 20px); } }
  @keyframes think { 50% { height: 9px; opacity: 1; } }

  .app-logo { width: 23px; height: 23px; object-fit: contain; }
  .pill-mark { width: 22px; height: 22px; margin-right: 9px; }
  .demo-controls { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 18px; }
  .scene-tabs { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; font-size: 12px; color: var(--ink-2); }
  .scene-tabs select { max-width: min(260px, 52vw); color: var(--ink); font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px; background: #fff; }
  .doc-title { font-size: 22px; font-weight: 500; margin: 8px 0 14px; }
  .doc-page { flex: 1; padding: 8px 14px; font-size: 16px; line-height: 1.65; white-space: pre-wrap; }
  .demo-controls button { font: inherit; font-size: 12px; border: 0; background: none; color: var(--ink-2); cursor: pointer; padding: 6px 9px; border-radius: 6px; }
  .demo-controls button[aria-pressed="true"] { background: var(--fill); color: var(--ink); }
  .demo-controls button:hover { background: var(--side); }
  .paused *, .paused *::after { animation-play-state: paused !important; }
  .win { animation: switch-app .5s cubic-bezier(.2,.8,.2,1); }
  @keyframes switch-app { from { opacity: .15; transform: translateY(10px) scale(.97); } }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  @media (max-width: 900px), (max-height: 600px) {
    body { overflow: auto; display: block; }
    main { grid-template-columns: 1fr; padding-top: 24px; padding-bottom: 48px; }
  }
  /* A quieter layout, with the app preview closer to the reader. */
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Plex Sans", sans-serif; background: #fbfbfd; letter-spacing: -.015em; }
  .wrap { max-width: 1560px; padding-inline: clamp(22px, 3vw, 48px); }
  nav { height: 72px; }
  nav .gh { font-size: 12px; }
  main { grid-template-columns: minmax(0, .7fr) minmax(0, 1.45fr); gap: clamp(32px, 4vw, 64px); padding-bottom: 28px; }
  h1 { font-family: inherit; font-size: clamp(60px, 7vw, 110px); font-weight: 600; line-height: 1.02; letter-spacing: -.06em; }
  h1 em { color: #86868b; }
  .lede { font-size: clamp(17px, 1.7vw, 22px); color: #6e6e73; line-height: 1.5; margin: 24px 0 28px; }
  .btn { height: 54px; padding: 0 25px; font-weight: 500; font-size: 16px; background: #1d1d1f; box-shadow: 0 4px 12px #00000008; }
  #osIcon { width: 21px; height: 21px; stroke: none; }
  #osKey svg { width: 11px; height: 11px; vertical-align: -1px; }
  .steps { margin-top: 40px; }
  .steps div { padding-top: 16px; }
  .steps b { font-size: 14px; }
  .tag { font-size: 12px; margin-bottom: 10px; }
  .win { height: clamp(350px, 67vh, 650px); border-radius: 24px; border-color: #e2e2e7; box-shadow: 0 24px 65px -24px #00000024; }
  .bar { height: 54px; padding-inline: 22px; background: #f5f5f7; font-size: 15px; }
  .body { padding: 28px; gap: 14px; }
  .msg, .input, .mail, .doc-page { font-size: 19px; line-height: 1.5; }
  .msg { border-radius: 18px; padding: 15px 19px; }
  .input { min-height: 62px; border-radius: 16px; padding: 16px 19px; }
  .doc-title { font-size: 28px; }
  .pill { height: 46px; padding-inline: 15px; bottom: 22px; border-radius: 24px; box-shadow: 0 8px 28px #00000018; }
  .pill i { width: 2.5px; }
  .demo-controls { margin-top: 14px; }
  .scene-tabs select { background: #fbfbfd; border-radius: 10px; }
  @media (max-width: 900px), (max-height: 600px) { main { grid-template-columns: 1fr; padding-bottom: 36px; } h1 { font-size: clamp(64px, 10vw, 96px); } .win { height: clamp(400px, 62vh, 600px); } }
  @media (max-width: 450px) { .body { padding: 20px; } .msg, .input, .mail, .doc-page { font-size: 17px; } .steps div + div { padding-left: 20px; } .steps div { padding-right: 20px; } }
</style>
</head>
<body>
  <nav class="wrap">
    <a class="brand" href="#"><img src="assets/logo.png" alt=""><b>Flow</b></a>
    <a class="gh" href="https://github.com/Ijtihed/flow-local">GitHub</a>
  </nav>

  <main class="wrap">
    <section>
      <h1>Talk.<br><em>It types.</em></h1>
      <p class="lede">Speak naturally. Flow does the typing.</p>
      <div class="cta"><a class="btn" id="download" href="https://github.com/Ijtihed/flow-local/releases/latest" aria-label="Choose a Flow download"><svg id="osIcon" viewBox="0 0 24 24" aria-hidden="true"></svg><span>Download</span></a></div>
      <div class="steps" id="steps">
        <div data-s="hold"><b>Hold</b><span><kbd>Ctrl</kbd> <kbd id="osKey" aria-label="Windows key"></kbd></span></div>
        <div data-s="talk"><b>Talk</b><span>anywhere</span></div>
        <div data-s="go"><b>Let go</b><span>it's typed</span></div>
      </div>
    </section>

    <div class="stage">
      <div class="tag" id="tag"></div>
      <div class="win" id="win"></div>
      <div class="demo-controls"><div class="scene-tabs"><label for="appPicker">Try an app</label><select id="appPicker" aria-label="Demo app"></select></div><button id="pause" aria-label="Pause demo">Pause</button></div>
    </div>
  </main>

<script src="assets/apps.js"></script>
<script>
(() => {
  const scenes = [
    { app: "Telegram", style: "very casual", kind: "chat", title: "Maya",
      before: ["coffee after class?"], text: "yeah i'm down, meet you outside in ten" },
    { app: "Firefox", style: "casual", kind: "browser", title: "Project notes",
      before: ["A thought for later"], text: "Check the results from today's experiment and send the notes before Friday" },
    { app: "Discord", style: "very casual", kind: "chat", title: "maya", avatar: "M",
      before: ["are you coming to the thing tonight??"], text: "deadass idk if i can make it, lowkey cooked from the lab" },
    { app: "Outlook", style: "formal", kind: "mail", to: "Maya Chen", subject: "Draft feedback",
      text: "Hi Maya,\n\nThanks for the notes on the draft. I will send the revised version by Friday.\n\nBest,\nAlex" },
    { app: "Codex", style: "very casual", kind: "chat", title: "flow-local", avatar: "AI",
      before: [], text: "why does my kubernetes pod keep restarting after the config change" },
    { app: "Slack", style: "casual", kind: "chat", title: "#launch", avatar: "#",
      before: ["can someone review the pricing page before 5?"], text: "On it, I'll push the fix after standup" },
  ];
  const originals = new Map(scenes.map(s => [s.app, s]));
  const writing = {
    docs: {style: "formal", kind: "doc", title: "Project notes", before: [], text: "The next draft should make the main idea clear. Start with what we learned, then explain what happens next."},
    email: {style: "formal", kind: "mail", to: "Maya Chen", subject: "A quick update", text: "Hi Maya,\n\nThe draft is ready for your review. Let me know what you think when you have a moment.\n\nThanks,\nAlex"},
    personal: {style: "very casual", kind: "chat", title: "Maya", before: ["still up for coffee?"], text: "yeah sounds good, i'll meet you there in ten"},
    work: {style: "casual", kind: "chat", title: "Project team", before: ["Any update on the draft?"], text: "The first draft is ready. I'll share the link after the meeting"},
    ai: {style: "very casual", kind: "chat", title: "New conversation", before: [], text: "help me turn these notes into a clear introduction and keep it in my own voice"},
    code: {style: "casual", kind: "chat", title: "Project discussion", before: [], text: "Can we add a check for empty input before saving the changes?"},
    other: {style: "casual", kind: "browser", title: "Project notes", before: ["A thought for later"], text: "Check the notes from today's meeting and send the next draft before Friday"},
  };
  scenes.splice(0, scenes.length, ...window.FLOW_APPS.map(a => ({...(originals.get(a.name) || writing[a.category]), app: a.name, logo: a.logo})));
  const $ = (s) => document.querySelector(s);
  const platform = navigator.userAgentData?.platform || navigator.platform || navigator.userAgent;
  const linux = /Linux/i.test(platform) && !/Android/i.test(navigator.userAgent);
  const windows = /Win/i.test(platform);
  const icons = {
    windows: '<path d="M2 4.4 10.4 3.2v8H2zm9.8-1.4L22 1.6v9.6H11.8zM2 12.6h8.4v8L2 19.4zm9.8 0H22v9.8L11.8 21z" fill="currentColor"/>',
    linux: '<path d="M7 9c-1-6 1-8 5-8s6 2 5 8c2 3 4 7 3 10-1 3-15 3-16 0-1-3 1-7 3-10" fill="currentColor"/><ellipse cx="12" cy="15" rx="5" ry="6" fill="white"/><ellipse cx="10" cy="6" rx="1.5" ry="2" fill="white"/><ellipse cx="14" cy="6" rx="1.5" ry="2" fill="white"/><circle cx="10" cy="6.5" r=".65"/><circle cx="14" cy="6.5" r=".65"/><path d="m9 8 3 2 3-2-3-1zM3 20l6-1 1 3H2zm12-1 6 1 1 2h-8z" fill="#f4b544"/>',
    other: '<path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>'
  };
  const os = linux ? "linux" : windows ? "windows" : "other";
  $("#osIcon").innerHTML = icons[os];
  $("#osKey").innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${icons[os]}</svg>`;
  $("#osKey").setAttribute("aria-label", linux ? "Super key" : "Windows key");
  const download = $("#download");
  if (linux || windows) {
    download.href = "https://github.com/Ijtihed/flow-local/releases/latest/download/" + (linux ? "Flow-x86_64.AppImage" : "FlowSetup.exe");
    download.setAttribute("aria-label", `Download Flow for ${linux ? "Linux" : "Windows"}`);
  }
  const win = $("#win"), tag = $("#tag"), steps = $("#steps");
  let paused = false, generation = 0, selected = 0;
  const wait = async (ms, gen) => {
    while (ms > 0) {
      if (gen !== generation) throw "restart";
      await new Promise(r => setTimeout(r, 50));
      if (!paused && !document.hidden) ms -= 50;
    }
    if (gen !== generation) throw "restart";
  };
  const pauseButton = $("#pause");
  function reflectPause() {
    pauseButton.textContent = paused ? "Play" : "Pause";
    pauseButton.setAttribute("aria-label", paused ? "Play demo" : "Pause demo");
    $(".stage").classList.toggle("paused", paused);
  }
  pauseButton.onclick = () => { paused = !paused; reflectPause(); };
  reflectPause();
  const picker = $("#appPicker");
  const groups = {docs: "Writing and notes", email: "Email", personal: "Personal chats", work: "Work and projects", ai: "AI", code: "Code", other: "Browsers"};
  for (const [category, label] of Object.entries(groups)) {
    const group = document.createElement("optgroup"); group.label = label;
    window.FLOW_APPS.forEach((app, index) => { if (app.category !== category) return; const option = document.createElement("option"); option.value = String(index); option.textContent = app.name; group.appendChild(option); });
    picker.appendChild(group);
  }
  picker.onchange = () => { selected = +picker.value; generation++; paused = false; reflectPause(); };
  document.querySelectorAll("[data-scene]").forEach(button => button.onclick = () => {
    selected = +button.dataset.scene; generation++; paused = false; reflectPause();
  });
  const step = (s) => steps.querySelectorAll("[data-s]").forEach((d) => d.classList.toggle("on", d.dataset.s === s));
  const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

  function pill() {
    const p = document.createElement("div");
    p.className = "pill";
    const mark = document.createElement("img");
    mark.src = "assets/logo.png"; mark.alt = "Flow"; mark.className = "pill-mark";
    p.appendChild(mark);
    const label = document.createElement("span"); label.className = "pill-label"; label.textContent = "Recording"; p.appendChild(label);
    for (let i = 0; i < 13; i++) {
      const b = document.createElement("i");
      const env = 1 - Math.abs(i - 6) / 6 * 0.5;
      b.style.setProperty("--h", (8 + Math.random() * 14 * env).toFixed(0) + "px");
      b.style.animationDelay = (-Math.random() * 0.5).toFixed(2) + "s";
      p.appendChild(b);
    }
    return p;
  }

  function render(sc) {
    tag.innerHTML = `<b>${sc.style}</b>`;
    win.style.animation = "none"; void win.offsetWidth; win.style.animation = "";
    if (sc.kind === "chat" || sc.kind === "browser") {
      win.innerHTML = `<div class="bar"><img class="app-logo" src="assets/logos/${sc.logo}" alt=""><span>${sc.app}</span><small>${sc.title}</small></div>
        <div class="body">${sc.before.map((m) => `<div class="msg">${esc(m)}</div>`).join("")}
        <div class="input"><span class="typed"></span><span class="caret"></span></div></div>`;
    } else if (sc.kind === "doc") {
      win.innerHTML = `<div class="bar"><img class="app-logo" src="assets/logos/${sc.logo}" alt=""><span>${sc.app}</span><small>Draft</small></div><div class="body"><div class="doc-page"><div class="doc-title">${esc(sc.title)}</div><span class="typed"></span><span class="caret"></span></div></div>`;
    } else {
      win.innerHTML = `<div class="bar"><img class="app-logo" src="assets/logos/${sc.logo}" alt=""><span>${sc.app}</span><small>New message</small></div>
        <div class="body"><div class="field"><span>To</span>${sc.to}</div><div class="field"><span>Subject</span>${sc.subject}</div>
        <div class="mail"><span class="typed"></span><span class="caret"></span></div></div>`;
    }
    const p = pill(); win.appendChild(p); return p;
  }

  async function play(sc, gen) {
    picker.value = String(selected);
    const p = render(sc);
    document.querySelectorAll("[data-scene]").forEach(b => {
      b.setAttribute("aria-pressed", String(+b.dataset.scene === selected));
    });
    steps.classList.remove("held");
    step(null); await wait(900, gen);
    steps.classList.add("held"); step("hold");
    p.classList.add("show", "listen"); await wait(500, gen);
    step("talk"); await wait(1500 + sc.text.length * 12, gen);
    steps.classList.remove("held"); step("go");
    p.querySelector(".pill-label").textContent = "Thinking";
    p.classList.replace("listen", "think"); await wait(650, gen);
    p.classList.remove("show");
    const out = win.querySelector(".typed");
    const parts = sc.text.split(/(\s+)/);
    for (const w of parts) {                       // Flow pastes all at once; revealed word by word so you can read it land
      if (/^\s+$/.test(w)) { out.append(w); continue; }
      const s = document.createElement("span"); s.className = "word"; s.textContent = w; out.appendChild(s);
      await wait(45, gen);
    }
    await wait(1100, gen);

    await wait(1900, gen);
  }

  (async () => {
    for (;;) {
      const gen = generation;
      try { await play(scenes[selected], gen); selected = (selected + 1) % scenes.length; }
      catch (error) { if (error !== "restart") { console.error(error); break; } }
    }
  })();
})();
</script>
</body>
</html>
