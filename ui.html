<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow</title>
<style>
  @font-face { font-family: "Plex Sans"; src: url("assets/PlexSans-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Plex Sans"; src: url("assets/PlexSans-500.woff2") format("woff2"); font-weight: 500; font-display: swap; }
  @font-face { font-family: "Plex Sans"; src: url("assets/PlexSans-600.woff2") format("woff2"); font-weight: 600; font-display: swap; }

:root {
    --bg: #FFFFFF;
    --side: #F7F7F5;
    --hover: #EFEFEC;
    --fill: #F3F3F1;
    --line: #EAEAE7;
    --ink: #141414;
    --ink-2: #6B6B68;
    --ink-3: #A5A5A1;
    --red: #D93025;
    --serif: "Plex Sans", "Iowan Old Style", Georgia, serif;
    --ease: cubic-bezier(.2,.8,.2,1);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 "Plex Sans", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; display: flex; overflow: hidden; user-select: none; letter-spacing: -.005em; }
  button, input, textarea, select { font: inherit; color: inherit; letter-spacing: inherit; }
  button { background: none; border: 0; cursor: pointer; padding: 0; }
  svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  [hidden] { display: none !important; }

  /* sidebar */
  aside { width: 224px; flex: none; background: var(--side); border-right: 1px solid var(--line); padding: 20px 12px 16px; display: flex; flex-direction: column; gap: 1px; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 10px 22px; }
  .brand img { width: 26px; height: 26px; }
  .brand b { font-family: var(--serif); font-weight: 500; font-size: 24px; letter-spacing: -.01em; line-height: 1; }
  .nav { display: flex; align-items: center; gap: 11px; height: 34px; padding: 0 10px; border-radius: 8px; color: var(--ink-2); width: 100%; text-align: left; font-weight: 500; transition: background .15s, color .15s; }
  .nav:hover { background: var(--hover); color: var(--ink); }
  .nav.on { background: var(--hover); color: var(--ink); }
  .nav .n { margin-left: auto; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .side-foot { margin-top: auto; padding: 0 10px; display: flex; flex-direction: column; gap: 10px; font-size: 12.5px; color: var(--ink-2); }
  .local { display: inline-flex; align-items: center; gap: 8px; }
  .local i { width: 6px; height: 6px; border-radius: 50%; background: #3C9A5F; }
  .keys { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
  kbd { font: 500 11.5px/1 "Plex Sans", sans-serif; color: var(--ink); background: #fff; border: 1px solid #DDDDD9; border-bottom-width: 2px; border-radius: 5px; padding: 3px 6px; }

  /* content */
  main { flex: 1; min-width: 0; overflow-y: auto; }
  main::-webkit-scrollbar { width: 10px; }
  main::-webkit-scrollbar-thumb { background: #DDDDD9; border-radius: 10px; border: 3px solid #fff; }
  .wrap { max-width: 800px; margin: 0 auto; padding: 58px 38px 64px; }
  .view { animation: in .3s var(--ease); }
  @keyframes in { from { opacity: 0; transform: translateY(4px); } }

  h1 { font-family: var(--serif); font-weight: 500; font-size: 44px; letter-spacing: -.015em; line-height: 1.05; margin: 0 0 10px; }
  h1 em { font-style: normal; color: var(--ink-2); }
  .lede { color: var(--ink-2); font-size: 14.5px; margin: 0 0 40px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .section { display: flex; align-items: baseline; justify-content: space-between; margin: 44px 0 4px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .section h2 { margin: 0; font-size: 12px; font-weight: 600; color: var(--ink-2); text-transform: uppercase; letter-spacing: .06em; }
  .section .aside { font-size: 12.5px; color: var(--ink-3); }

  .row { display: flex; align-items: center; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--line); min-height: 60px; }
  .row .l { flex: 1; min-width: 0; }
  .row .l b { display: block; font-weight: 550; font-size: 14px; }
  .row .l small { display: block; color: var(--ink-2); font-size: 13px; margin-top: 2px; line-height: 1.45; max-width: 460px; }
  .row.col { flex-wrap: wrap; }
  .row.col .under { flex-basis: 100%; }

  /* home */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .stat { padding: 20px 0 18px 20px; }
  .stat:first-child { padding-left: 0; }
  .stat + .stat { border-left: 1px solid var(--line); }
  .stat b { display: block; font-family: var(--serif); font-weight: 500; font-size: 40px; line-height: 1; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .stat span { display: block; margin-top: 8px; color: var(--ink-2); font-size: 12.5px; }
  .apps { padding-top: 6px; }
  .app-name { display: flex; align-items: center; gap: 7px; }
  .app-name img { width: 18px; height: 18px; object-fit: contain; }
  .appbar { display: grid; grid-template-columns: 120px 1fr 32px; align-items: center; gap: 16px; padding: 9px 0; font-size: 13.5px; }
  .appbar .track { height: 3px; background: var(--fill); border-radius: 3px; overflow: hidden; }
  .appbar .track i { display: block; height: 100%; background: var(--ink); border-radius: 3px; transform-origin: left; animation: grow .8s var(--ease) both; }
  @keyframes grow { from { transform: scaleX(0); } }
  .appbar .c { color: var(--ink-3); text-align: right; font-variant-numeric: tabular-nums; font-size: 12.5px; }
  .search { display: flex; align-items: center; gap: 6px; color: var(--ink-3); }
  .search svg { width: 15px; height: 15px; }
  .search input { width: 150px; background: none; border: 0; outline: 0; color: var(--ink); font-size: 13px; }
  .search input::placeholder { color: var(--ink-3); }
  .day { font-size: 12.5px; font-weight: 500; color: var(--ink-3); margin: 28px 0 0; }
  .entry { display: flex; gap: 18px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .entry time { width: 42px; flex: none; color: var(--ink-3); font-size: 12.5px; font-variant-numeric: tabular-nums; padding-top: 2px; }
  .entry .body { flex: 1; min-width: 0; }
  .entry p { margin: -3px -6px; padding: 3px 6px; border-radius: 6px; user-select: text; overflow-wrap: anywhere; white-space: pre-wrap; cursor: text; font-size: 14.5px; line-height: 1.5; transition: background .12s; }
  .entry p:hover { background: var(--fill); }
  .entry p.editing { background: #fff; box-shadow: 0 0 0 1.5px var(--ink); outline: 0; }
  .meta { margin-top: 5px; font-size: 12px; color: var(--ink-3); }
  .acts { display: flex; gap: 2px; opacity: 0; transition: opacity .12s; align-self: flex-start; margin-top: -4px; }
  .entry:hover .acts { opacity: 1; }
  .icon { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; color: var(--ink-3); transition: background .12s, color .12s; }
  .icon:hover { background: var(--fill); color: var(--ink); }
  .icon svg { width: 16px; height: 16px; }
  .empty { color: var(--ink-2); padding: 36px 0; border-bottom: 1px solid var(--line); }
  .empty strong { display: block; color: var(--ink); font-family: var(--serif); font-weight: 500; font-size: 24px; margin-bottom: 4px; }

  /* forms */
  .adder { display: flex; gap: 10px; flex-wrap: wrap; padding: 4px 0 8px; }
  .field { flex: 1; min-width: 170px; height: 40px; padding: 0 14px; border-radius: 10px; background: #fff; border: 1px solid #DEDEDA; outline: 0; font-size: 14px; transition: border-color .15s; }
  .field:focus { border-color: var(--ink); }
  .field::placeholder { color: var(--ink-3); }
  textarea.field { height: auto; min-height: 80px; padding: 11px 14px; resize: vertical; line-height: 1.45; flex-basis: 100%; }
  .btn { height: 40px; padding: 0 20px; border-radius: 20px; background: var(--ink); color: #fff; font-weight: 550; font-size: 13.5px; transition: opacity .15s, transform .15s var(--ease); }
  .btn:hover { opacity: .86; } .btn:active { transform: scale(.98); }
  .btn:disabled { background: var(--fill); color: var(--ink-3); cursor: default; opacity: 1; }
  .btn.ghost { background: #fff; color: var(--ink); border: 1px solid #DEDEDA; height: 32px; padding: 0 14px; font-size: 13px; }
  .link { color: var(--ink); font-size: 13px; font-weight: 500; text-decoration: underline; text-decoration-color: #CFCFCB; text-underline-offset: 3px; }
  .link:hover { text-decoration-color: var(--ink); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 16px 0 4px; }
  .term { display: inline-flex; align-items: center; gap: 4px; height: 30px; padding: 0 6px 0 12px; border-radius: 15px; border: 1px solid #E3E3DF; font-size: 13px; background: #fff; transition: border-color .12s; }
  .term:hover { border-color: #C9C9C4; }
  .term.you { background: var(--ink); border-color: var(--ink); color: #fff; }
  .term .x { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; opacity: .35; transition: opacity .12s; }
  .term:hover .x { opacity: .8; }
  .term .x svg { width: 11px; height: 11px; stroke-width: 2.2; }
  .term .tag { font-size: 11px; opacity: .6; margin-left: 2px; }
  .fix { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .fix .from { color: var(--ink-3); text-decoration: line-through; }
  .note { font-size: 12px; color: var(--ink-3); }
  .snip .t { font-weight: 550; }
  .snip .e { color: var(--ink-2); font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 2px; }

  /* controls */
  .seg { position: relative; display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--fill); border-radius: 9px; padding: 2px; flex: none; }
  .seg button { position: relative; z-index: 1; height: 28px; padding: 0 12px; font-size: 12.5px; font-weight: 500; color: var(--ink-2); border-radius: 7px; white-space: nowrap; transition: color .2s; }
  .seg button.on { color: var(--ink); }
  .seg .thumb { position: absolute; z-index: 0; top: 2px; bottom: 2px; left: 2px; border-radius: 7px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 0 0 1px rgba(0,0,0,.04); transition: transform .3s var(--ease), width .3s var(--ease); }
  .switch { width: 40px; height: 24px; border-radius: 24px; background: #DCDCD8; position: relative; transition: background .2s; flex: none; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.18); transition: transform .3s var(--ease); }
  .switch.on { background: var(--ink); } .switch.on::after { transform: translateX(16px); }
  select { font-size: 13px; font-weight: 500; background: #fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236B6B68' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m7 10 5 5 5-5'/></svg>") no-repeat right 9px center / 13px; border: 1px solid #DEDEDA; border-radius: 8px; height: 32px; padding: 0 30px 0 12px; appearance: none; outline: 0; cursor: pointer; }
  .langs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .lang { height: 30px; padding: 0 13px; border-radius: 15px; border: 1px solid #E3E3DF; font-size: 13px; background: #fff; transition: all .15s; }
  .lang:hover { border-color: #C9C9C4; }
  .lang.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .example { margin-top: 12px; font-family: var(--serif); font-size: 19px; color: var(--ink); }
  .example span { font-family: "Plex Sans", sans-serif; font-size: 12px; color: var(--ink-3); margin-right: 10px; }
  .danger { color: var(--red); font-weight: 500; font-size: 13.5px; }
  .danger.confirm { background: var(--red); color: #fff; padding: 6px 12px; border-radius: 16px; }
  .path { font-size: 12px; color: var(--ink-2); font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; overflow-wrap: anywhere; }
  .state { font-size: 12.5px; color: var(--ink-2); }

  /* onboarding */
  .ob { position: fixed; inset: 0; background: #fff; display: flex; align-items: flex-start; justify-content: center; z-index: 50; overflow-y: auto; padding: 42px 0; }
  .ob-card { width: min(530px, 90vw); margin: auto 0; animation: in .4s var(--ease); }
  .ob-card .logo { width: 56px; height: 56px; margin-bottom: 28px; display: block; }
  .ob-card h1 { font-size: 48px; }
  .ob-body { display: flex; flex-direction: column; }
  .ob-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 36px; }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: #DCDCD8; transition: all .3s var(--ease); }
  .dots i.on { width: 18px; border-radius: 3px; background: var(--ink); }
  .label { font-size: 12px; font-weight: 600; color: var(--ink-2); text-transform: uppercase; letter-spacing: .06em; margin: 22px 0 10px; }
  .bar { height: 3px; border-radius: 3px; background: var(--fill); overflow: hidden; margin-top: 12px; }
  .bar i { display: block; height: 100%; background: var(--ink); transition: width .4s; }
  .done { color: #3C9A5F; font-weight: 550; font-size: 13px; display: inline-flex; align-items: center; gap: 5px; }
  .done svg { width: 15px; height: 15px; stroke-width: 2.4; }
  .hold { display: flex; gap: 8px; }
  .hold kbd { font-size: 16px; padding: 10px 16px; border-radius: 10px; animation: press 2.4s ease-in-out infinite; }
  .hold kbd:nth-child(2) { animation-delay: .1s; }
  @keyframes press { 0%, 60%, 100% { transform: none; } 20%, 45% { transform: translateY(2px); border-bottom-width: 1px; } }

  .toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 12px); opacity: 0; background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 20px; font-size: 13px; font-weight: 500; transition: all .3s var(--ease); pointer-events: none; z-index: 99; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .app-chrome { position: fixed; inset: 0 0 auto; height: 32px; z-index: 90; display: flex; justify-content: flex-end; }
  .app-chrome button { width: 46px; font-size: 18px; background: #ffffffc9; }
  .app-chrome button:hover { background: var(--fill); }
  .app-chrome button:last-child:hover { background: #c93232; color: white; }
  .native aside { padding-top: 42px; }
  .update-access { margin: 12px 0; font-size: 13px; color: var(--ink-2); }
  .update-access summary { cursor: pointer; }
  .update-access .adder { margin-top: 12px; }
  .update-progress { width: 100%; height: 3px; accent-color: var(--ink); margin-top: 10px; }
  .update-dialog { position: fixed; inset: 0; z-index: 120; display: grid; place-items: center; padding: 24px; background: #0003; }
  .update-card { width: min(360px, 100%); padding: 26px; border: 1px solid var(--line); border-radius: 22px; background: #fff; box-shadow: 0 16px 60px #0002; animation: update-in .14s var(--ease) both; }
  .update-card h2 { font-size: 25px; line-height: 1.2; letter-spacing: -.6px; margin: 0 0 10px; }
  .update-card p { color: var(--ink-2); font-size: 14px; line-height: 1.5; margin: 0 0 22px; }
  .update-actions { display: flex; justify-content: flex-end; align-items: center; gap: 18px; }
  @keyframes update-in { from { opacity: 0; transform: translateY(5px) scale(.985); } to { opacity: 1; transform: none; } }
  .speech-form { border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin: 16px 0; }
  .speech-form .field { width: 100%; min-width: 0; }
  .speech-form label { display: block; margin: 14px 0 6px; font-size: 13px; font-weight: 500; }
  .speech-form select { width: 100%; height: 38px; }
  .speech-choices { display: flex; gap: 8px; }
  .speech-choice { flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: 10px; text-align: left; font-size: 13px; }
  .speech-choice.on { background: #F3F3F1; border-color: #141414; }
  .speech-choice small { display: block; color: var(--ink-2); font-size: 12px; margin-top: 3px; }
  .api-notice { background: #fff7e7; border-radius: 10px; padding: 12px 14px; margin-top: 14px; font-size: 12.5px; color: #6d5125; line-height: 1.5; }
  .api-notice a { color: inherit; }
  .consent { display: flex !important; align-items: flex-start; gap: 8px; line-height: 1.5; }
  .consent input { margin-top: 4px; flex: none; }
  .form-error { color: var(--red); font-size: 13px; margin: 10px 0 0; }
  .form-status { color: var(--ink-2); font-size: 12.5px; margin: 10px 0; }
  .shortcut-example { background: #F3F3F1; border-radius: 14px; padding: 16px 20px; margin: -18px 0 24px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 14px; }
  .shortcut-example b { font-weight: 500; }
  .ob.leaving, .tutorial.leaving { animation: setup-out .28s var(--ease) both; pointer-events: none; }
  .ob.leaving .ob-card { animation: card-out .28s var(--ease) both; }
  .tutorial { position: fixed; inset: 0; background: #f7f7f5ce; backdrop-filter: blur(8px); z-index: 80; display: grid; place-items: center; padding: 24px; overflow: auto; animation: setup-in .28s var(--ease); }
  .tour-card { width: min(480px, 100%); background: white; border: 1px solid var(--line); border-radius: 22px; padding: 30px; box-shadow: 0 16px 60px #1414140d; animation: tour-in .32s var(--ease); }
  .tour-card h1 { font-size: 30px; letter-spacing: -.035em; }
  .tour-card p { color: var(--ink-2); font-size: 14px; }
  #tourHint { margin: 12px 0 6px; }
  .practice-phrase { margin: 0 0 22px; font-size: 17px; font-weight: 500; }
  .practice-output { display: block; width: 100%; height: 120px; padding: 16px; border: 1px solid #ddddd9; border-radius: 12px; resize: none; background: white; user-select: text; font-size: 18px; line-height: 1.5; transition: border-color .15s, box-shadow .15s; }
  .practice-output:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 2px #14141408; }
  .tutorial[data-state="passed"] .practice-output { border-color: #3c9a5f; }
  .tour-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 40px; margin-top: 12px; }
  #practiceState { font-size: 12px; color: var(--ink-2); }
  .tour-foot .btn { padding: 8px 18px; }
  .practice-note { font-size: 11px !important; margin: 12px 0 0; line-height: 1.45; }
  @keyframes setup-in { from { opacity: 0; } }
  @keyframes setup-out { to { opacity: 0; } }
  @keyframes card-out { to { opacity: 0; transform: translateY(-8px); } }
  @keyframes tour-in { from { opacity: 0; transform: translateY(10px); } }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid #141414; outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { *, *::after { animation: none !important; transition: none !important; } }
  @media (max-height: 650px) { .ob { align-items: flex-start; overflow-y: auto; padding: 42px 0; } .ob-foot { margin-top: 20px; } #tutorial { align-items: flex-start; padding: 18px; } .tour-card { padding: 24px; } }
  mark { background: #FFF1A8; color: inherit; border-radius: 2px; }
  @media (max-width: 820px) { aside { width: 64px; } .brand b, .nav span, .side-foot { display: none; } .stats { grid-template-columns: repeat(2, 1fr); } .stat:nth-child(3) { border-left: 0; padding-left: 0; } .wrap { padding: 36px 24px 60px; } }
  .health-notice { position: fixed; z-index: 120; top: 18px; right: 22px; width: min(420px, calc(100vw - 44px)); padding: 18px 22px; border: 1px solid #ecd6ae; background: #fffaf0; border-radius: 18px; box-shadow: 0 8px 36px #00000012; }
  .health-notice b { font-size: 15px; font-weight: 500; } .health-notice p { margin: 6px 0 10px; font-size: 12px; color: var(--ink-2); }
  .report-dialog { position: fixed; z-index: 140; inset: 0; display: grid; place-items: center; padding: 20px; background: #f7f7f5dd; backdrop-filter: blur(14px); overflow-y: auto; }
  .report-card { width: min(580px,100%); max-height: calc(100vh - 40px); overflow-y: auto; padding: 28px; background: white; border: 1px solid var(--line); border-radius: 24px; box-shadow: 0 24px 70px #00000012; }
  .report-card h2 { font-size: 25px; margin: 0 0 8px; } .report-card p { font-size: 13px; color: var(--ink-2); }
  .report-card textarea { width: 100%; min-height: 220px; resize: vertical; font: 11px/1.5 ui-monospace, monospace; padding: 14px; border: 1px solid var(--line); border-radius: 12px; }
  .report-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-top: 18px; }
</style>
</head>

<script src="assets/apps.js"></script>
<script>
(() => {
const SHORTCUTS = { "ctrl+win": ["Ctrl", "Win"], "right ctrl": ["Right Ctrl"], "caps lock": ["Caps Lock"], "f8": ["F8"] };
const LANGS = { en: "English", fi: "Finnish", fr: "French", ar: "Arabic", sv: "Swedish", de: "German", es: "Spanish", it: "Italian", nl: "Dutch", pt: "Portuguese", et: "Estonian", ru: "Russian", tr: "Turkish", zh: "Chinese", ja: "Japanese", hi: "Hindi", ur: "Urdu" };
const CATS = [
  ["personal", "Personal chats", "WhatsApp, Discord, Telegram, Instagram"],
  ["work", "Work chats", "Teams, Slack, LinkedIn"],
  ["email", "Email", "Outlook, Gmail and other mail"],
  ["ai", "AI chats", "ChatGPT, Claude, Codex, Gemini"],
  ["code", "Code", "VS Code, Cursor, terminals"],
  ["docs", "Docs and notes", "Word, Notion, Obsidian, Google Docs"],
  ["other", "Everything else", "Browsers and all other apps"],
];
const APP_NAMES = Object.fromEntries(window.FLOW_APPS.flatMap(a => [a.id, ...a.aliases].map(k => [k.toLowerCase(), a.name])));
const STYLE_EX = { formal: "Hey, are we still on for tonight? I can bring snacks.", casual: "Hey, are we still on for tonight? I can bring snacks", "very casual": "hey are we still on for tonight? i can bring snacks" };
const $ = (s) => document.querySelector(s);
const api = () => window.pywebview.api;
let view = "home", items = [], stamp = -1, confirmClear = false, showAllNotes = false, showTech = false, scanning = false, query = "";
let S = { shortcut: "ctrl+win", styles: {}, languages: ["en"], snippets: [], cleanup: true, learn: true, texting: true, voice_notes: {}, ollama: {} };
let M = { terms: [], fixes: [], scanned: null }, I = { words: 0, minutes_saved: 0, wpm: 0, apps: [], known: 0 };

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const kbd = (sc) => (SHORTCUTS[sc] || [sc]).map((k) => `<kbd>${k}</kbd>`).join("");
const APP_LOGOS = Object.fromEntries(window.FLOW_APPS.flatMap(a => [a.id, ...a.aliases].map(k => [k.toLowerCase(), a.logo])));
const appKey = (a) => (a || "").toLowerCase().replace(/\.exe$/, "");
const appName = (a) => { const k = appKey(a); return APP_NAMES[k] || (k ? k[0].toUpperCase() + k.slice(1) : ""); };
const appLogo = (a) => APP_LOGOS[appKey(a)];
const mine = () => M.terms.filter((t) => ["you", "learned", "history", "project"].includes(t.source));
const section = (title, aside = "") => `<div class="section"><h2>${title}</h2>${aside !== "" ? `<span class="aside">${aside}</span>` : ""}</div>`;

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 1900); }
function countUp(el) {
  const to = +el.dataset.to, t0 = performance.now();
  const step = (t) => { const p = Math.min(1, (t - t0) / 650), e = 1 - Math.pow(1 - p, 3); el.textContent = Math.round(to * e).toLocaleString(); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function seg(key, value, options) {
  return `<div class="seg" data-seg="${key}">${options.map((o) => `<button data-v="${o}" class="${o === value ? "on" : ""}">${o[0].toUpperCase() + o.slice(1)}</button>`).join("")}<span class="thumb"></span></div>`;
}
function layoutSegs() {
  document.querySelectorAll(".seg").forEach((g) => {
    const on = g.querySelector("button.on") || g.querySelector("button"), th = g.querySelector(".thumb");
    th.style.width = on.offsetWidth + "px"; th.style.transform = `translateX(${on.offsetLeft - 2}px)`;
  });
}
function dayLabel(d) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const x = new Date(d); x.setHours(0, 0, 0, 0);
  const diff = Math.round((today - x) / 864e5);
  if (diff === 0) return "Today";
  if (diff === 1) return "Yesterday";
  return x.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
}

// ---------------------------------------------------------------- home
let greetingVisit = 0;
function greeting() {
  const now = new Date();
  I.today_count = items.filter(i => new Date(i.ts).toDateString() === now.toDateString()).length;
  const h = now.getHours(), period = h < 5 ? "late" : h < 12 ? "morning" : h < 18 ? "afternoon" : "evening";
  const time = {late: "Up late", morning: "Good morning", afternoon: "Good afternoon", evening: "Good evening"}[period];
  const today = I.today_count || 0;
  const idleDays = I.last_used ? (Date.now() - new Date(I.last_used).getTime()) / 864e5 : 0;
  let options = [time, "Ready when you are"];
  if (!(I.sessions || 0)) options = [time, "Make yourself at home"];
  else if (idleDays >= 3) options = ["Welcome back", time];
  else if (today >= 10) options = ["You're in a rhythm", time, "Words are flowing"];
  else if (today > 0) options = [time, "Back for more", "Keep it flowing"];
  if (S.mood === "focused") options = ["Let's get into it", time, "One thought at a time"];
  if (S.mood === "relaxed") options = ["Take your time", time, "Easy does it"];
  if (S.mood === "low-energy") options = ["A little less typing", time, "Take it easy"];
  const index = (greetingVisit + Math.floor(Date.now() / 1800000)) % options.length;
  return {title: options[index]};
}
function updateGreeting() {
  if (view !== "home" || !$("#greeting")) return;
  const g = greeting(), first = (S.name || "").split(" ")[0];
  $("#greeting").innerHTML = `${esc(g.title)}${first ? `, <em>${esc(first)}</em>` : ""}`;
}
function renderHome() {
  const q = query.trim().toLowerCase();
  const list = q ? items.filter((i) => i.text.toLowerCase().includes(q)) : items;
  const g = greeting();
  const first = (S.name || "").split(" ")[0];
  const top = I.apps[0] ? I.apps[0][1] : 1;
  let html = `<h1 id="greeting">${esc(g.title)}${first ? `, <em>${esc(first)}</em>` : ""}</h1>
    <p class="lede">Hold ${kbd(S.shortcut)} and talk. Let go, and it's typed.</p>
    <div class="stats">
      <div class="stat"><b data-to="${I.words}">0</b><span>words dictated</span></div>
      <div class="stat"><b data-to="${I.minutes_saved}">0</b><span>minutes saved</span></div>
      <div class="stat"><b data-to="${I.wpm}">0</b><span>words per minute</span></div>
      <div class="stat"><b data-to="${I.known}">0</b><span>of your words learned</span></div>
    </div>`;
  if (I.apps.length) {
    html += section("Where you talk") + `<div class="apps">${I.apps.map(([a, c]) => `<div class="appbar"><span class="app-name">${appLogo(a) ? `<img src="assets/logos/${appLogo(a)}" alt="">` : ""}${esc(appName(a))}</span><span class="track"><i style="width:${Math.max(3, c / top * 100)}%"></i></span><span class="c">${c}</span></div>`).join("")}</div>`;
  }
  html += `<div class="section"><h2>Recent</h2><label class="search"><svg><use href="#i-search"/></svg><input id="q" placeholder="Search" spellcheck="false" value="${esc(query)}"></label></div>`;
  if (!items.length) {
    html += `<div class="empty"><strong>Nothing yet.</strong>Hold ${kbd(S.shortcut)} anywhere and say something.</div>`;
  } else if (!list.length) {
    html += `<div class="empty"><strong>No matches.</strong>Nothing you've said contains "${esc(q)}".</div>`;
  } else {
    let last = "";
    for (const i of list.slice(0, 300)) {
      const d = new Date(i.ts), label = dayLabel(d);
      if (label !== last) { html += `<div class="day">${label}</div>`; last = label; }
      let text = esc(i.text);
      if (q) text = text.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), (m) => `<mark>${m}</mark>`);
      const meta = [appName(i.app), i.lang && i.lang !== "en" && (LANGS[i.lang] || i.lang)].filter(Boolean).join(" · ");
      html += `<div class="entry" data-ts="${i.ts}"><time>${d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false })}</time>
        <div class="body"><p class="editable" title="Click to fix a word. Flow learns from it.">${text}</p>${meta ? `<div class="meta">${esc(meta)}</div>` : ""}</div>
        <div class="acts"><button class="icon" data-act="copy" title="Copy"><svg><use href="#i-copy"/></svg></button><button class="icon" data-act="delete" title="Delete"><svg><use href="#i-trash"/></svg></button></div></div>`;
    }
  }
  $("#view").innerHTML = html;
  if (!renderHome.animated) { document.querySelectorAll(".stat b").forEach(countUp); renderHome.animated = true; }
  else document.querySelectorAll(".stat b").forEach((b) => (b.textContent = (+b.dataset.to).toLocaleString()));
  const qi = $("#q");
  qi.oninput = () => { query = qi.value; const pos = qi.selectionStart; renderHome(); const n = $("#q"); n.focus(); n.setSelectionRange(pos, pos); };
}

function startEdit(p) {
  if (p.isContentEditable) return;
  const row = p.closest(".entry"), item = items.find((i) => i.ts === row.dataset.ts);
  p.textContent = item.text; p.contentEditable = "true"; p.classList.add("editing"); p.focus();
  document.getSelection().selectAllChildren(p); document.getSelection().collapseToEnd();
  const done = async (save) => {
    p.onblur = p.onkeydown = null; p.contentEditable = "false"; p.classList.remove("editing");
    const text = p.innerText.trim();
    if (save && text && text !== item.text) {
      const learned = await api().edit(item.ts, text);
      await refresh(true); M = await api().memory();
      toast(learned.length ? "Learned " + learned.join(", ") : "Saved");
    } else renderHome();
  };
  p.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); done(true); } if (e.key === "Escape") { e.preventDefault(); done(false); } };
  p.onblur = () => done(true);
}

// ---------------------------------------------------------------- dictionary
function chip(t) {
  const tag = t.source === "learned" ? `<span class="tag">learned</span>` : t.source === "history" ? `<span class="tag">you say this</span>` : "";
  return `<span class="term ${t.source === "you" || t.source === "learned" ? "you" : ""}">${esc(t.text)}${tag}<button class="x" data-rm="${esc(t.text)}" title="Remove"><svg><use href="#i-x"/></svg></button></span>`;
}
function renderDictionary() {
  const by = (s) => M.terms.filter((t) => t.source === s);
  const you = M.terms.filter((t) => t.source === "you" || t.source === "learned");
  const notes = by("notes"), projects = by("project"), said = by("history"), built = [...by("tech"), ...by("slang")];
  const scan = M.scanned ? JSON.parse(M.scanned) : null;
  let html = `<h1>Dictionary</h1><p class="lede">Add the spelling you want. If Flow gets it wrong, add what it writes too.</p>
    <div class="adder">
      <input class="field" id="d-word" placeholder="Add a word or a name" aria-label="Word or name" maxlength="60" spellcheck="false">
      <input class="field" id="d-heard" placeholder="It keeps writing… (optional)" aria-label="What Flow writes instead (optional)" maxlength="120" spellcheck="false">
      <button class="btn" id="d-add" disabled>Add word</button></div>
    ${section("Yours", you.length)}${you.length ? `<div class="chips">${you.map(chip).join("")}</div>` : `<div class="empty">Words you add, and words Flow learns from your fixes.</div>`}`;
  if (M.fixes.length) {
    html += section("Fixes it applies") + M.fixes.map((f) => `<div class="row"><div class="l fix"><span class="from">${esc(f.heard)}</span><span>→</span><span>${esc(f.term)}</span>${f.active ? "" : `<span class="note">active after one more</span>`}</div>
      <button class="icon" data-rmfix="${esc(f.heard)}" data-term="${esc(f.term)}" title="Forget"><svg><use href="#i-x"/></svg></button></div>`).join("");
  }
  if (said.length) html += section("Things you say a lot") + `<div class="chips">${said.map(chip).join("")}</div>`;
  if (projects.length) html += section("Your projects", projects.length) + `<div class="chips">${projects.map(chip).join("")}</div>`;
  html += `<div class="section"><h2>From your notes</h2><button class="link" id="d-scan">${scanning ? "Scanning…" : "Rescan"}</button></div>
    ${scan ? `<p class="note" style="margin:12px 0 0">${notes.length} terms from ${scan.files} notes in ${scan.vaults.map(esc).join(" and ")}. Remove anything that doesn't belong.</p>` : ""}
    <div class="chips">${(showAllNotes ? notes : notes.slice(0, 48)).map(chip).join("") || `<span class="note">Flow reads your Obsidian vaults on this PC to learn your names, places and projects.</span>`}</div>
    ${notes.length > 48 ? `<p style="margin:10px 0 0"><button class="link" id="d-more">${showAllNotes ? "Show fewer" : `Show all ${notes.length}`}</button></p>` : ""}`;
  if (built.length) {
    html += `<div class="section"><h2>Built in</h2><button class="link" id="d-tech">${showTech ? "Hide" : "Show"} ${built.length}</button></div>
      <p class="note" style="margin:12px 0 0">Tech spelled properly (GitHub, NumPy, PyTorch) and slang spelled how it's typed (deadass, lowkey, rizz).</p>
      ${showTech ? `<div class="chips">${built.map(chip).join("")}</div>` : ""}`;
  }
  $("#view").innerHTML = html;
  const w = $("#d-word"), hh = $("#d-heard"), b = $("#d-add");
  w.oninput = () => (b.disabled = !w.value.trim());
  let adding = false;
  const add = async () => {
    const word = w.value.trim(); if (!word || adding) return;
    adding = true; b.disabled = true;
    try { await api().add_term(word, hh.value.trim()); M = await api().memory(); render(); toast("Added " + word); $("#d-word").focus(); }
    catch (error) { toast(error.message || String(error)); }
    finally { adding = false; if (b.isConnected) b.disabled = !w.value.trim(); }
  };
  b.onclick = add; [w, hh].forEach((el) => el.onkeydown = (e) => {
    if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); add(); }
  });
  document.querySelectorAll("[data-rm]").forEach((el) => el.onclick = async () => { await api().remove_term(el.dataset.rm); M = await api().memory(); render(); });
  document.querySelectorAll("[data-rmfix]").forEach((el) => el.onclick = async () => { await api().remove_fix(el.dataset.rmfix, el.dataset.term); M = await api().memory(); render(); });
  $("#d-scan").onclick = async () => { if (scanning) return; scanning = true; render(); const r = await api().scan_vaults(); scanning = false; M = await api().memory(); render(); toast(`Found ${r.terms} terms in ${r.files} notes`); };
  if ($("#d-more")) $("#d-more").onclick = () => { showAllNotes = !showAllNotes; render(); };
  if ($("#d-tech")) $("#d-tech").onclick = () => { showTech = !showTech; render(); };
}

// ---------------------------------------------------------------- snippets
function renderSnippets() {
  let html = `<h1>Spoken shortcuts</h1><p class="lede">Save a phrase once. Say it while dictating and Flow types the full text for you.</p>
    <div class="shortcut-example"><span>Say <b>“my email”</b></span><span>→</span><span>Types <b>alex@example.com</b></span></div>
    <div class="adder">
      <input class="field" id="s-trigger" placeholder='When I say… e.g. "my email"' spellcheck="false">
      <textarea class="field" id="s-text" placeholder="…type this instead" spellcheck="false"></textarea>
      <button class="btn" id="s-add" disabled>Add shortcut</button></div>
    ${section("Your shortcuts", S.snippets.length || "")}`;
  html += S.snippets.length ? S.snippets.map((s, i) => `<div class="row"><div class="l snip"><div class="t">"${esc(s.trigger)}"</div><div class="e">${esc(s.text)}</div></div>
      <button class="icon" data-del="${i}" title="Remove"><svg><use href="#i-trash"/></svg></button></div>`).join("")
    : `<div class="empty"><strong>None yet.</strong>Try one for your email address or a calendar link.</div>`;
  $("#view").innerHTML = html;
  const t = $("#s-trigger"), x = $("#s-text"), b = $("#s-add");
  t.oninput = x.oninput = () => (b.disabled = !t.value.trim() || !x.value.trim());
  b.onclick = async () => { const trigger = t.value.trim(); await save({ snippets: [{ trigger, text: x.value }, ...S.snippets.filter((s) => s.trigger.toLowerCase() !== trigger.toLowerCase())] }, "Shortcut added"); };
  document.querySelectorAll("[data-del]").forEach((el) => el.onclick = () => { const n = S.snippets.slice(); n.splice(+el.dataset.del, 1); save({ snippets: n }, "Removed"); });
}

// ---------------------------------------------------------------- settings
function speechForm(id, config, models, recommended) {
  const chosen = models.find(m => m.id === config.model);
  const options = (!config.model ? '<option value="" selected disabled>Choose a model</option>' : '') + models.map(m => `<option value="${m.id}" ${config.model === m.id ? "selected" : ""} ${m.supported === false ? 'disabled' : ''}>${esc(m.id)} · ${m.gb} GB download${m.id === recommended ? " · recommended" : ""}${m.supported === false ? ' · needs more RAM' : m.gpu_ok === false ? ' · CPU' : ''}${m.ready ? " · downloaded" : ""}</option>`).join("");
  const memory = chosen?.ram_gb ? `About ${chosen.ram_gb} GB free RAM${chosen.gpu_ok ? ` and ${chosen.vram_gb} GB VRAM` : ' · CPU inference'}. ${S.free_ram_gb != null ? `${S.free_ram_gb} GB RAM available.` : 'Available RAM could not be measured.'} ${S.free_vram_gb != null ? `${S.free_vram_gb} GB VRAM available.` : ''}` : 'Small uses less memory. Turbo balances speed and accuracy. Large-v3 gives the strongest local recognition.';
  const standard = ["gpt-transcribe", "gpt-4o-mini-transcribe", "gpt-4o-transcribe", "whisper-1"];
  const apiOptions = [...standard, ...(!standard.includes(config.apiModel) ? [config.apiModel] : [])];
  return `<div class="speech-form" id="${id}"><div class="speech-choices" role="group" aria-label="Speech engine">
    <button class="speech-choice ${config.provider === "local" ? "on" : ""}" data-provider="local" aria-pressed="${config.provider === "local"}">On-device<small>Works offline after download</small></button>
    <button class="speech-choice ${config.provider === "api" ? "on" : ""}" data-provider="api" aria-pressed="${config.provider === "api"}">API<small>Your provider transcribes audio</small></button></div>
    ${config.provider === "local" ? `<label for="${id}-model">Speech model</label><select id="${id}-model">${options}</select><p class="form-status">${esc(memory)} ${chosen?.memory_known === false ? 'Memory estimates include headroom; GPU availability could not be fully checked.' : ''}</p>`
    : `<label for="${id}-api-model">API model</label><select id="${id}-api-model">${apiOptions.map(m => `<option ${m === config.apiModel ? "selected" : ""}>${esc(m)}</option>`).join("")}<option value="custom">Custom model…</option></select>
      <input class="field" id="${id}-custom" aria-label="Custom transcription model" placeholder="Your provider's transcription model ID" hidden>

// ---------------------------------------------------------------- updates
let updateTimer, updateBusy = false;
let updatePolling = false, updateFocus, popupState = {}, updateRequested = false;
const updateSeen = new Set();
function closeUpdatePopup() {

function drawUpdatePopup(state) {
  popupState = state;
  const dialog = $("#updateDialog"), busy = ["downloading", "installing"].includes(state.phase);
  const notice = `${state.latest}/${state.check_id || 0}`;
  if (dialog.hidden) {
    if (state.phase !== "available" || !state.latest || state.recording || state.busy || updateSeen.has(notice) || !S.onboarded ||
        !$("#ob").hidden || !$("#tutorial").hidden || !$("#reportDialog").hidden || document.activeElement?.isContentEditable ||
        document.activeElement?.matches('input, textarea, select')) return;
    updateFocus = document.activeElement; dialog.hidden = false;

  }
  if (state.phase === "current") { closeUpdatePopup(); return; }
  $("#updateTitle").textContent = state.phase === "installing" ? "Restarting Flow" : state.phase === "downloading" ? "Updating Flow" : "An update is ready";
  $("#updateDetail").textContent = state.message || (state.phase === "installing" ? "Your saved data stays here." : state.phase === "downloading" ? `Downloading · ${state.progress || 0}%` : `Flow ${state.latest} is ready. Your saved data stays here.`);
  $("#updateNow").disabled = busy || updateRequested || state.phase === "checking";
  $("#updateNow").textContent = busy ? "Updating…" : state.phase === "error" ? "Try again" : "Update";
  $("#popupProgress").hidden = state.phase !== "downloading";
  $("#popupProgress").value = state.progress || 0;

}
$("#updateLater").onclick = closeUpdatePopup;
$("#updateNow").onclick = async () => {

};

    const first = buttons[0], last = buttons.at(-1);

    $("#setupSpeech").inert = true;
    if (!await applySpeech("setupSpeech", ob.speech)) { $("#setupSpeech").inert = false; btn.disabled = false; btn.textContent = "Try again"; return; }
    if (ob.speech.provider === "local" && ob.gpu && ob.sys.gpu && !ob.sys.cuda && ob.sys.models?.find(m => m.id === ob.speech.model)?.gpu_ok !== false) {
      $("#setupSpeech-status").textContent = "Downloading GPU acceleration…";
      if (!await api().setup_run("cuda")) { $("#setupSpeech").inert = false; btn.disabled = false; btn.textContent = "Continue"; return; }
      const st = await new Promise(resolve => pollSetup(resolve, p => { $("#setupSpeech-status").textContent = p.total ? `GPU acceleration · ${Math.round(p.done / p.total * 100)}%` : "Starting GPU download…"; }));
      if (st.error) {
        const error = $("#setupSpeech-error"); error.hidden = false; error.textContent = "GPU download failed. Uncheck acceleration to continue on the CPU, or try again.";
        $("#setupSpeech").inert = false; btn.disabled = false; btn.textContent = "Try again"; return;
      }
    }
  }
  if (ob.step === 3) {
    btn.disabled = true; btn.textContent = "Getting to know you…";
    if (ob.notes) await api().enable_voice_notes(true);
    await api().finish_onboarding(ob.name, ob.langs, ob.scan && (ob.sys.vaults || []).length > 0);
    await boot();
    $("#scroll").inert = true; $("aside").inert = true;
    await fadeAway($("#ob"));
    showTutorial();
    return;
  }
  ob.step++; obRender();
}

// ---------------------------------------------------------------- shell
async function fadeAway(layer) {
  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    layer.classList.add("leaving");
    // A bounded timer also handles WebViews that don't dispatch animationend.
    await new Promise(resolve => setTimeout(resolve, 280));
  }
  layer.hidden = true; layer.classList.remove("leaving");
}
let tourTimer, tourFocus, tourData, tourState = "loading", tourPolling = false;
async function showTutorial() {
  clearInterval(tourTimer); tourFocus = document.activeElement; tourState = "loading";
  const modal = $("#tutorial"); modal.hidden = false; modal.dataset.state = "loading";
  $("#scroll").inert = true; $("aside").inert = true;
  modal.innerHTML = `<div class="tour-card"><h1 id="tourTitle">Your first dictation</h1>
    <p id="tourHint">Hold ${kbd(S.shortcut)}, say this, then let go.</p>
    <blockquote class="practice-phrase">“<span id="practicePhrase"></span>”</blockquote>
    <textarea class="practice-output" id="practiceOutput" aria-label="Your dictation" aria-describedby="tourHint practicePhrase practiceState" readonly></textarea>
    <div class="tour-foot"><span id="practiceState" role="status">Getting ready…</span><button class="btn" id="practiceAction" hidden disabled>Continue</button></div>
    <p class="practice-note" id="practiceNote" hidden></p>
    <p class="form-error" id="practiceError" role="alert" hidden></p>
    <button class="link" id="practiceOptions" hidden>Speech settings</button><div id="practiceOptionsPanel" hidden></div></div>`;
  document.removeEventListener("keydown", tourKeys); document.addEventListener("keydown", tourKeys);
  $("#practiceAction").onclick = async () => {
    const button = $("#practiceAction"); button.disabled = true;
    try {
      if (tourState === "passed") await finishTutorial();
    } catch (error) { $("#practiceError").textContent = error.message || String(error); $("#practiceError").hidden = false; button.disabled = false; }
  };
  // Engine recovery appears only on a failure; the ordinary practice stays empty.
  $("#practiceOptions").onclick = () => {
    const panel = $("#practiceOptionsPanel"); panel.hidden = !panel.hidden;
    if (panel.hidden) { $("#practiceOutput").focus(); return; }
    const config = speechConfig();
    const draw = () => {
      panel.innerHTML = speechForm("practiceSpeech", config, S.speech_models || [], S.recommended_model || "small") + `<button class="btn" id="practiceSaveEngine">Use this engine</button>`;
      bindSpeech("practiceSpeech", config, draw);
      $("#practiceSaveEngine").onclick = async e => {
        const button = e.currentTarget; button.disabled = true;
        if (await applySpeech("practiceSpeech", config)) {
          try {
            tourData = await api().practice_open(document.hasFocus());
            $("#practicePhrase").textContent = tourData.phrase;
            $("#practiceOutput").value = "";
            await pollPractice();
            clearInterval(tourTimer); tourTimer = setInterval(pollPractice, 200);
          } catch (error) {
            $("#practiceError").textContent = error.message || String(error);
            $("#practiceError").hidden = false; button.disabled = false; return;
          }
          panel.hidden = true;
          $("#practiceNote").hidden = config.provider !== "api";
          $("#practiceNote").textContent = "Audio is sent to your speech provider. Its data policy and API fees apply.";
          $("#practiceOutput").focus();
        } else button.disabled = false;
      };
    }; draw();
  };
  try {
    tourData = await api().practice_open(document.hasFocus());
    $("#practicePhrase").textContent = tourData.phrase;
    if (tourData.api) {
      $("#practiceNote").hidden = false;
      $("#practiceNote").textContent = `Audio is sent to ${tourData.provider || "your speech provider"}. Its data policy and API fees apply.`;
    }
    $("#practiceOutput").focus({preventScroll:true});
    await pollPractice(); tourTimer = setInterval(pollPractice, 200);
  } catch (error) { $("#practiceError").textContent = error.message || String(error); $("#practiceError").hidden = false; $("#practiceOptions").hidden = false; }
}
function tourKeys(e) {
  if (e.key === "Escape") { e.preventDefault(); if (tourState === "recording") api().practice_cancel(); return; }
  if (e.key === "Tab") {
    const controls = [...$("#tutorial").querySelectorAll("textarea,button,input,select,a")].filter(b => !b.closest('[hidden]') && !b.disabled);
    if (!controls.length) { e.preventDefault(); return; }
    const first = controls[0], last = controls.at(-1);
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
}
async function pollPractice() {
  if (tourPolling || $("#tutorial").hidden) return;
  tourPolling = true;
  try {
    const status = await api().practice_status(document.hasFocus());
    if ($("#tutorial").hidden) return;
    const output = $("#practiceOutput");
    if (status.phase === 'recording' && tourState !== 'recording') output.value = '';
    tourState = status.phase;
    const recording = status.phase === "recording", thinking = status.phase === "thinking", passed = status.phase === "passed" && status.matched;
    $("#tutorial").dataset.state = status.phase;
    output.dataset.ready = String(!!status.ready && status.phase !== "loading");
    $("#practiceState").textContent = recording ? "Listening…" : thinking ? "Thinking…" : passed ? "That's it." : status.phase === "loading" || !status.ready ? "Getting ready…" : "";
    $("#practiceAction").hidden = !passed;
    $("#practiceAction").disabled = !passed;
    $("#practiceError").hidden = !status.message || passed;
    $("#practiceError").textContent = status.message || "";
    const engineError = status.phase === "error" || (status.phase === "retry" && status.text === undefined && !!status.message);
    $("#practiceOptions").hidden = !engineError;
    if (recording || thinking || passed) $("#practiceOptionsPanel").hidden = true;
    if (!recording && !thinking && status.text !== undefined) output.value = status.text || "";
  } catch (error) { $("#practiceError").textContent = error.message || String(error); $("#practiceError").hidden = false; $("#practiceOptions").hidden = false; }
  finally {tourPolling = false;}
}
async function finishTutorial() {
  await api().practice_complete();
  clearInterval(tourTimer); document.removeEventListener("keydown", tourKeys);
  await fadeAway($("#tutorial"));
  $("#scroll").inert = false; $("aside").inert = false;
  S.tutorial_seen = true; S.tutorial_version = 2;
  if (tourFocus && tourFocus.isConnected && !tourFocus.closest('[hidden]')) tourFocus.focus();
  else $('.nav.on').focus();
}
window.addEventListener("pagehide", () => { if (!$("#tutorial").hidden) api().practice_close(); });
for (const event of ['focus', 'blur']) window.addEventListener(event, () => {
  if (tourData && !$("#tutorial").hidden) api().practice_focus(document.hasFocus());
});
async function save(patch, msg = "Saved") { await api().save_settings(patch); S = await api().settings(); render(); toast(msg); }
function render() {
  const counts = { home: items.length, dictionary: mine().length, snippets: S.snippets.length };
  for (const k of ["home", "dictionary", "snippets"]) $("#n-" + k).textContent = counts[k] || "";
  $("#footKeys").innerHTML = kbd(S.shortcut) + `<span style="margin-left:2px">to talk</span>`;
  $("#platformLabel").textContent = S.version ? `v${S.version}` : "";
  if (document.activeElement && (document.activeElement.isContentEditable || document.activeElement.id === "q")) return;
  ({ home: renderHome, dictionary: renderDictionary, snippets: renderSnippets, settings: renderSettings })[view]();
}
async function refresh(force) {
  const s = await api().stamp();
  if (!force && s === stamp) return;
  const active = document.activeElement;
  if (!force && $("#view").contains(active) && (active.isContentEditable || active.matches("input,textarea,select"))) return;
  stamp = s; items = await api().history(); I = await api().insights();
  if (!force) { S = await api().settings(); M = await api().memory(); }
  render();
}
document.querySelectorAll(".nav").forEach((b) => b.onclick = () => {
  document.querySelectorAll(".nav").forEach((x) => x.classList.toggle("on", x === b));
  view = b.dataset.view; confirmClear = false; $("#scroll").scrollTop = 0; renderHome.animated = view !== "home";
  if (view === "home") greetingVisit++;
  render(); const v = $("#view"); v.classList.remove("view"); void v.offsetWidth; v.classList.add("view");
});
$("#view").addEventListener("click", async (e) => {
  const p = e.target.closest("p.editable"); if (p) return startEdit(p);
  const btn = e.target.closest("[data-act]"); if (!btn) return;
  const ts = btn.closest(".entry").dataset.ts, item = items.find((i) => i.ts === ts);
  if (btn.dataset.act === "copy") { await api().copy(item.text); toast("Copied"); }
  else { await api().delete(ts); await refresh(true); toast("Deleted"); }
});
window.addEventListener("resize", layoutSegs);

let diagnosticsPolling = false, reportFocus;
async function refreshDiagnostics() {
  if (diagnosticsPolling || !api().diagnostics) return;
  diagnosticsPolling = true;
  try {
    const report = await api().diagnostics();
    $("#healthNotice").hidden = report.status !== "failed";
  } catch (_) {} finally { diagnosticsPolling = false; }
}
async function showSpeechReport() {
  const report = await api().diagnostics(); reportFocus = document.activeElement;
  $("#reportDialog").hidden = false;
  $("#reportSummary").textContent = report.status === "passed" ? "The local speech engine passed its startup check." : report.status === "checking" ? "Checking known audio with your speech engine…" : report.status === "not_run" ? report.reason : "The speech check needs attention. Attach this report to your support message.";
  $("#reportText").value = JSON.stringify(report,null,2); $("#copyReport").focus();
}
$("#reviewReport").onclick = showSpeechReport;
$("#copyReport").onclick = async () => { await api().copy_speech_report(); toast("Report copied. Paste it into your support message."); };
$("#exportReport").onclick = async () => { const file = await api().export_speech_report(); toast("Report saved to " + file); };
$("#closeReport").onclick = () => { $("#reportDialog").hidden = true; if (reportFocus && reportFocus.isConnected) reportFocus.focus(); };
$("#reportDialog").addEventListener("keydown", e => {
  if (e.key === "Escape") { e.stopPropagation(); $("#closeReport").click(); }
  if (e.key === "Tab") { const first = $("#reportText"), last = $("#closeReport"); if(e.shiftKey && document.activeElement===first){e.preventDefault();last.focus();} else if(!e.shiftKey && document.activeElement===last){e.preventDefault();first.focus();} }
});
async function boot() {
  S = await api().settings(); M = await api().memory();
  await refresh(true);
  clearInterval(boot.h); boot.h = setInterval(refresh, 1500);
}
async function init() {
  if (init.done) return; init.done = true;
  S = await api().settings();
  if (S.platform === "linux") SHORTCUTS["ctrl+win"] = ["Ctrl", "Super"];
  if (S.native_window) { document.body.classList.add("native"); $("#appChrome").hidden = false; }
  document.querySelectorAll("[data-window]").forEach(b => b.onclick = () => api().window_action(b.dataset.window));
  if (!S.onboarded) {
    $("#scroll").inert = true; $("aside").inert = true;
    ob.sys = await api().system(); S.free_ram_gb = ob.sys.free_ram_gb; S.free_vram_gb = ob.sys.free_vram_gb; ob.name = S.name || ""; ob.langs = S.languages && S.languages.length ? S.languages : ["en"];
    ob.speech = speechConfig(); ob.speech.model = ob.sys.recommended_model; ob.speech.consent = false;
    $("#ob").hidden = false; obRender();
  }
  await boot();
  if (S.onboarded && S.tutorial_version !== 2) showTutorial();
  await refreshDiagnostics(); setInterval(refreshDiagnostics, 2500);
  try { await api().check_updates(); } catch (_) {}
  await pollUpdates(); updateTimer = setInterval(pollUpdates, 500);
  setInterval(updateGreeting, 60000);
}
if (window.pywebview && window.pywebview.api && window.pywebview.api.settings) init();
else window.addEventListener("pywebviewready", init);
})();
</script>
